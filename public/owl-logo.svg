<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Body -->
  <ellipse cx="50" cy="62" rx="28" ry="30" fill="#3730a3"/>
  <!-- Left wing -->
  <ellipse cx="25" cy="68" rx="12" ry="20" fill="#1e1b4b" transform="rotate(-15 25 68)"/>
  <!-- Right wing -->
  <ellipse cx="75" cy="68" rx="12" ry="20" fill="#1e1b4b" transform="rotate(15 75 68)"/>
  <!-- Head -->
  <ellipse cx="50" cy="38" rx="22" ry="20" fill="#3730a3"/>
  <!-- Ear tufts -->
  <polygon points="33,22 28,8 38,18" fill="#1e1b4b"/>
  <polygon points="67,22 72,8 62,18" fill="#1e1b4b"/>
  <!-- Left eye white -->
  <circle cx="40" cy="38" r="9" fill="white"/>
  <!-- Right eye white -->
  <circle cx="60" cy="38" r="9" fill="white"/>
  <!-- Left eye gold ring -->
  <circle cx="40" cy="38" r="7" fill="#f59e0b"/>
  <!-- Right eye gold ring -->
  <circle cx="60" cy="38" r="7" fill="#f59e0b"/>
  <!-- Left pupil -->
  <circle cx="40" cy="38" r="4" fill="#1e1b4b"/>
  <!-- Right pupil -->
  <circle cx="60" cy="38" r="4" fill="#1e1b4b"/>
  <!-- Eye shine -->
  <circle cx="42" cy="36" r="1.5" fill="white"/>
  <circle cx="62" cy="36" r="1.5" fill="white"/>
  <!-- Beak -->
  <polygon points="50,43 45,50 55,50" fill="#f59e0b"/>
  <!-- Chest pattern -->
  <ellipse cx="50" cy="68" rx="14" ry="18" fill="#4f46e5" opacity="0.5"/>
</svg>
